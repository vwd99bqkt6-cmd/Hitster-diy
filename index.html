<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Hitster DIY</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: linear-gradient(135deg, #6a0dad, #111);
      color: white;
      padding: 20px;
    }
    #reader {
      width: 300px;
      margin: auto;
      margin-top: 20px;
    }
    button {
      padding: 12px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #1DB954;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>🎵 Hitster DIY</h1>
<p>QR-Code scannen und Song starten</p>

<div id="reader"></div>

<button onclick="startScanner()">Scanner starten</button>

<script>
function openSpotify(link) {
  try {
    // Track-ID extrahieren
    let match = link.match(/track\/([a-zA-Z0-9]+)/);
    if (!match) {
      window.location.href = link;
      return;
    }

    let trackId = match[1];

    // Deep Link (öffnet App direkt)
    let appLink = "spotify:track:" + trackId;

    // Fallback nach 1 Sekunde auf Web
    setTimeout(() => {
      window.location.href = link;
    }, 1000);

    // Versuch App zu öffnen
    window.location.href = appLink;

  } catch (e) {
    window.location.href = link;
  }
}

function startScanner() {
  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {
    if (devices.length) {
      let cameraId = devices[0].id;

      html5QrCode.start(
        cameraId,
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          html5QrCode.stop();
          openSpotify(decodedText);
        }
      );
    }
  }).catch(err => {
    alert("Kamerafehler: " + err);
  });
}
</script>

</body>
</html>
