<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Hitster</title>

<link rel="manifest" href="/Hitster-diy/manifest.json">
<meta name="theme-color" content="#ff2ea6">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hitster">
<link rel="apple-touch-icon" href="/Hitster-diy/icon.png">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  margin:0;
  font-family:-apple-system;
  background: radial-gradient(circle,#2a003f,#000);
  color:white;
  text-align:center;
}

/* SPLASH */
#splash {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #2a003f, #000);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  animation: bgPulse 2s infinite alternate;
}

#splash h1 {
  font-size: 42px;
  color:#ff2ea6;
  text-shadow: 0 0 20px #ff2ea6, 0 0 40px #ff2ea6;
  animation: logoIn 0.8s ease-out;
}

#splash.hidden {
  opacity:0;
  transition:0.6s;
  pointer-events:none;
}

/* ANIMATIONS */
@keyframes logoIn {
  0% { transform: scale(0.6); opacity:0; }
  100% { transform: scale(1); opacity:1; }
}

@keyframes bgPulse {
  0% { filter: brightness(1); }
  100% { filter: brightness(1.2); }
}

/* UI */
.logo {
  font-size:40px;
  color:#ff2ea6;
  text-shadow:0 0 20px #ff2ea6;
  margin-top:40px;
}

.speaker {
  width:200px;
  height:200px;
  margin:40px auto;
  border-radius:50%;
  background:radial-gradient(circle,#777,#111);
}

button {
  width:80%;
  padding:16px;
  border-radius:16px;
  border:none;
  font-size:18px;
  margin:10px;
}

.play { background:#ff2ea6; }
.secondary { background:#333; }

#app { display:none; padding:20px; }
#reader { width:100%; border-radius:16px; }

.card {
  margin-top:15px;
  padding:15px;
  border-radius:16px;
  background:rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <h1>HITSTER</h1>
  <p>Loading your party...</p>
</div>

<!-- HOME -->
<div id="home">
  <div class="logo">HITSTER</div>
  <div class="speaker"></div>
  <button class="play" onclick="startApp()">JETZT SPIELEN</button>
</div>

<!-- APP -->
<div id="app">
  <h2>🎵 Scan Song</h2>

  <div id="reader"></div>
  <button onclick="startScanner()">📷 Scannen</button>

  <div id="result" class="card" style="display:none;"></div>
</div>

<script>
let html5QrCode;

// Splash Animation
window.addEventListener("load", () => {
  const splash = document.getElementById("splash");

  setTimeout(() => {
    splash.classList.add("hidden");

    setTimeout(() => {
      splash.style.display = "none";
    }, 600);
  }, 1200);
});

// Start
function startApp(){
  document.getElementById("home").style.display="none";
  document.getElementById("app").style.display="block";
}

// Scanner
function startScanner(){
  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },
    text=>{
      html5QrCode.stop();
      beep(); vibrate();
      handleQR(text);
    }
  );
}

// QR
function handleQR(text){
  let parts = text.split("|");
  let link = parts[0];
  let title = parts[1] || "Unknown";
  let artist = parts[2] || "";

  showResult(link,title,artist);
}

// Anzeige
function showResult(link,title,artist){
  let id = link.match(/track\/([a-zA-Z0-9]+)/)?.[1];

  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML = `
    <h3>${title}</h3>
    <p>${artist}</p>

    ${id ? `
      <iframe src="https://open.spotify.com/embed/track/${id}"
      width="100%" height="80"></iframe>
    `:""}

    <button class="play" onclick="openSpotify('${link}')">
      ▶️ Spotify
    </button>

    <button class="secondary" onclick="restart()">
      🔄 Neuer Scan
    </button>
  `;
}

// Spotify öffnen
function openSpotify(link){
  let id = link.match(/track\/([a-zA-Z0-9]+)/)?.[1];

  if(id){
    window.location = "spotify:track:"+id;
    setTimeout(()=>window.location=link,800);
  } else {
    window.location = link;
  }
}

// Reset
function restart(){
  document.getElementById("result").style.display="none";
}

// Sound
function beep(){
  let ctx=new AudioContext();
  let o=ctx.createOscillator();
  let g=ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.2);
}

// Vibration
function vibrate(){
  if(navigator.vibrate) navigator.vibrate(100);
}

// Service Worker
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/Hitster-diy/sw.js");
}
</script>

</body>
</html>
