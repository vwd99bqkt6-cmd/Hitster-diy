<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hitster DIY Pro</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #6a0dad, #111);
  color: white;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  min-height: 100vh;
  padding: 15px;
}

/* Header kompakt */
h1 {
  font-size: 22px;
  margin: 10px 0 5px;
}

p {
  font-size: 14px;
  margin-bottom: 10px;
}

/* Scanner größer + mittig */
#reader {
  width: 90vw;
  max-width: 320px;
  margin: 15px auto;
}

/* Buttons groß + klickbar */
button {
  width: 90%;
  max-width: 320px;
  padding: 14px;
  margin: 8px 0;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}

/* Farben */
.play { background: #1DB954; }
.scan { background: #2196f3; }
.next { background: #ff9800; }

/* Input full width */
input {
  width: 90%;
  max-width: 320px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
}

/* Timeline kompakt */
.timeline {
  width: 90%;
  max-width: 320px;
  margin-top: 20px;
  padding: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 12px;
}

/* Timeline Einträge */
.song {
  padding: 8px;
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<h1>🎵 Hitster DIY</h1>
<p>Scannen → Song hören → Jahr einordnen</p>

<div id="reader"></div>

<button class="scan" onclick="startScanner()">📷 Scannen</button>

<div id="result"></div>

<div class="timeline">
  <h3>📅 Timeline</h3>
  <div id="timeline"></div>
</div>

<script>
let timeline = [];

// 📷 Kamera starten (RÜCKKAMERA FIX)
function startScanner() {
  const html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: { exact: "environment" } },
    {
      fps: 10,
      qrbox: { width: 250, height: 250 }
    },
    (decodedText) => {
      html5QrCode.stop();
      showResult(decodedText);
    },
    (error) => {}
  ).catch(err => {
    alert("Kamera Fehler: " + err);
  });
}

// 🎵 Ergebnis anzeigen
function showResult(link) {
  document.getElementById("result").innerHTML = `
    <p>🎵 Song erkannt</p>
    <button class="play" onclick="openSpotify('${link}')">
      ▶️ In Spotify öffnen
    </button>
    <br>
    <input id="yearInput" placeholder="Jahr schätzen (z.B. 2005)">
    <br>
    <button class="next" onclick="addToTimeline('${link}')">
      ➕ Zur Timeline hinzufügen
    </button>
  `;
}

// 🎧 Spotify öffnen (iPhone FIX)
function openSpotify(link) {
  let match = link.match(/track\/([a-zA-Z0-9]+)/);

  if (!match) {
    window.location.href = link;
    return;
  }

  let trackId = match[1];

  // Deep Link (öffnet App)
  let a = document.createElement("a");
  a.href = "spotify:track:" + trackId;
  document.body.appendChild(a);
  a.click();

  // Fallback
  setTimeout(() => {
    window.location.href = link;
  }, 1000);
}

// 📅 Timeline hinzufügen
function addToTimeline(link) {
  let year = document.getElementById("yearInput").value;

  if (!year) {
    alert("Bitte Jahr eingeben");
    return;
  }

  timeline.push({ year: parseInt(year), link });

  timeline.sort((a, b) => a.year - b.year);

  renderTimeline();

  document.getElementById("result").innerHTML = "";
}

// 📊 Timeline anzeigen
function renderTimeline() {
  let html = "";

  timeline.forEach(item => {
    html += `<div class="song">${item.year}</div>`;
  });

  document.getElementById("timeline").innerHTML = html;
}
</script>

</body>
</html>
